# ===== IoT 设备网关配置 =====
# 每设备待处理（PENDING）指令缓冲上限
iot.gateway.max-commands-per-device=100
# 每设备遥测历史保留条数（有界，超出按最旧淘汰/超限拒绝）
iot.gateway.max-telemetry-per-device=1000
# 规则处理队列容量，满时按丢弃最旧背压
iot.gateway.rule-queue-capacity=200
# 每设备规则结论保留条数
iot.gateway.max-events-per-device=500
# 离线指令默认有效期（秒）
iot.gateway.command-ttl-seconds=300
# 设备登记总数上限
iot.gateway.max-devices=1000
# 单条规则保留的历史版本上限（含候选），打满后准备候选/新版本被明确拒绝
iot.gateway.max-rule-versions-per-rule=50
# 规则总数上限，打满后新增规则被明确拒绝（已有规则与实时判定不受影响）
iot.gateway.max-rules=200
# 规则治理审计留痕（试跑/切换/回退/复看）条数上限，超出淘汰最旧
iot.gateway.max-audit-entries=2000
# 实时事件留存上限（供试跑圈选历史样本与按版本复看），超出淘汰最旧
iot.gateway.max-stored-events=5000

spring.jackson.deserialization.fail-on-unknown-properties=false
