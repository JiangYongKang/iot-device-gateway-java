# ============================================================
# IoT 设备网关配置（所有容量/配额/策略均可在此覆盖）
# 前缀统一为 iot.gateway
# ============================================================

# - 会话 -
# 全局同时在线会话上限，超限接入返回 CAPACITY_EXCEEDED
iot.gateway.session.max-connections=10000

# - 离线指令缓冲 -
# 单设备离线指令队列长度上限，超限返回 COMMAND_QUEUE_FULL（不残留部分状态）
iot.gateway.command.queue-capacity-per-device=100
# 待下发指令默认有效期（毫秒）；重新上线/扫描时超过有效期标记 EXPIRED
iot.gateway.command.default-ttl-millis=300000

# - 遥测 -
# 时钟回拨容忍窗口（毫秒）：倒退<=窗口判 STALE_TIMESTAMP，>窗口判 CLOCK_ROLLBACK
iot.gateway.telemetry.clock-rollback-tolerance-millis=60000
# 每设备保留遥测历史条数（仅用于查询/排障，不影响最新值与判定）
iot.gateway.telemetry.history-per-device=200

# - 期望状态 -
# 每设备保留的期望版本数量（超出淘汰最旧，收敛结论仍可在当前视图查询）
iot.gateway.state.retained-revisions-per-device=50

# - 固件升级 -
# 进行中升级超过该时长未回报判定为设备失联 TIMED_OUT
iot.gateway.firmware.upgrade-timeout-millis=120000
# 失败/失联后是否自动回滚到升级前版本
iot.gateway.firmware.rollback-on-failure=true

# - 规则引擎 -
# 事件积压队列容量
iot.gateway.rules.backlog-capacity=2000
# 队列满策略：DISCARD_OLDEST（淘汰最旧，计 eventBacklogDiscards）/
#            DISCARD_NEWEST（拒绝新事件 BACKLOG_DISCARDED）/
#            BLOCK（拒绝 EVENT_QUEUE_FULL）
iot.gateway.rules.backlog-policy=DISCARD_OLDEST
# 处理线程数（1 保证严格顺序；>1 时单事件异常仍隔离）
iot.gateway.rules.worker-threads=1

# - 全局容量 -
# 已登记设备总数上限，超限返回 CAPACITY_EXCEEDED
iot.gateway.capacity.max-registered-devices=100000
